# menteecollege.com — Static HTML site
server {
    listen 80;
    server_name www.menteecollege.com;
    return 301 http://menteecollege.com$request_uri;
}

server {
    listen 80;
    server_name menteecollege.com;

    root /home/andrew/server/nursesandcompanions_and_menteecollege/MenteeCollege;
    index index.html;

    # FAQ Agent WebSocket
    location /ws/chat/ {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
