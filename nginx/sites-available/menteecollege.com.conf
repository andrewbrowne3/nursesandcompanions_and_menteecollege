# menteecollege.com — Static HTML site
server {
    listen 80;
    server_name www.menteecollege.com;
    return 301 http://menteecollege.com$request_uri;
}

server {
    listen 80;
    server_name menteecollege.com;

    root /home/andrew/server/nursesandcompanions_and_menteecollege/MenteeCollege;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
