# api.menteecollege.com — Django API (Gunicorn + Daphne)
server {
    server_name api.menteecollege.com;

    client_max_body_size 100M;

    # Django static files (collectstatic output)
    location /static/ {
        alias /home/andrew/server/nursesandcompanions_and_menteecollege/menteeCollegePortal/menteecollegewebsite/staticfiles/;
    }

    # Django media / uploads
    location /Mentee_College_api_media/ {
        alias /home/andrew/server/nursesandcompanions_and_menteecollege/menteeCollegePortal/menteecollegewebsite/media/;
    }

    # WebSocket traffic -> Daphne
    location /ws/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Everything else -> Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.menteecollege.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.menteecollege.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.menteecollege.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.menteecollege.com;
    return 404; # managed by Certbot


}