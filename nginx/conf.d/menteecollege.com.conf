# ---------- menteecollege.com (static HTML site) ----------
# www redirect
server {
    listen 80;
    listen 443 ssl;
    server_name www.menteecollege.com;

    ssl_certificate     /etc/letsencrypt/live/menteecollege.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menteecollege.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    return 301 https://menteecollege.com$request_uri;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name menteecollege.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name menteecollege.com;

    ssl_certificate     /etc/letsencrypt/live/menteecollege.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menteecollege.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    root /usr/share/nginx/menteecollege;
    index index.html;

    # FAQ Agent WebSocket
    location /ws/chat/ {
        proxy_pass http://faq-agent:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
