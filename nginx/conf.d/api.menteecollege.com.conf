# ---------- api.menteecollege.com ----------
server {
    listen 80;
    server_name api.menteecollege.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Django static files (collectstatic output)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Django media / uploads
    location /Mentee_College_api_media/ {
        alias /app/media/;
    }

    # FAQ Agent WebSocket -> FastAPI agent
    location /ws/agent/ {
        proxy_pass http://faq-agent:5010/ws/chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # WebSocket traffic -> Daphne
    location /ws/ {
        proxy_pass http://backend-ws:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Everything else -> Gunicorn
    location / {
        proxy_pass http://backend-http:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
