# ---------- api.menteecollege.com ----------
# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name api.menteecollege.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.menteecollege.com;

    ssl_certificate     /etc/letsencrypt/live/api.menteecollege.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.menteecollege.com/privkey.pem;
    include /etc/nginx/ssl-params.conf;

    # Django static files (collectstatic output)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Django media / uploads
    location /Mentee_College_api_media/ {
        alias /app/media/;
    }

    # WebSocket traffic -> Daphne
    location /ws/ {
        proxy_pass http://backend-ws:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Everything else -> Gunicorn
    location / {
        proxy_pass http://backend-http:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
