services:
  # ---------- Django HTTP (Gunicorn) ----------
  backend-http:
    build:
      context: ./menteeCollegePortal/menteecollegewebsite
      dockerfile: Dockerfile
    command: gunicorn menteecollegewebsite.wsgi:application --bind 0.0.0.0:8010 --workers 3 --timeout 120
    volumes:
      - ./db:/data/db
      - ./menteeCollegePortal/menteecollegewebsite/staticfiles:/app/staticfiles
      - ./menteeCollegePortal/menteecollegewebsite/media:/app/media
    env_file:
      - ./menteeCollegePortal/menteecollegewebsite/menteecollegewebsite/.env
    environment:
      - REDIS_HOST=127.0.0.1
    depends_on:
      - redis
    restart: unless-stopped
    network_mode: host

  # ---------- Django WebSocket (Daphne) ----------
  backend-ws:
    build:
      context: ./menteeCollegePortal/menteecollegewebsite
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8012 menteecollegewebsite.asgi:application
    volumes:
      - ./db:/data/db
      - ./menteeCollegePortal/menteecollegewebsite/staticfiles:/app/staticfiles
      - ./menteeCollegePortal/menteecollegewebsite/media:/app/media
    env_file:
      - ./menteeCollegePortal/menteecollegewebsite/menteecollegewebsite/.env
    environment:
      - REDIS_HOST=127.0.0.1
    depends_on:
      - redis
    restart: unless-stopped
    network_mode: host

  # ---------- FAQ Agent (FastAPI) ----------
  faq-agent:
    build:
      context: .
      dockerfile: mentee_agent/Dockerfile
    volumes:
      - ./db:/data/db
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MENTEE_AGENT_PORT=5010
      - DB_PATH=/data/db/db.sqlite3
    restart: unless-stopped
    network_mode: host

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped
    network_mode: host

volumes:
  redis-data:
